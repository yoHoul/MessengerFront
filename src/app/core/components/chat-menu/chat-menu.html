<div class="container">
    <p-listbox
        [options]="chats()"
        optionLabel="title"
        optionValue="id"
        dataKey="id"
        [ngModel]="selectedChatId()"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="onSelectionChange($event)"
        scrollHeight="100%"
        fluid
        class="chat-list"
        style="border: none;"
    >
        <ng-template let-chat pTemplate="item">
            <div class="chat-item">
                <p-avatar [label]="initials(chat)" shape="circle"></p-avatar>

                <div class="chat-item__body">
                    <div class="chat-item__top">
                        <span class="chat-item__title">{{ chat.title }}</span>
                        @if (chat.lastMessageAt) {
                            <span class="chat-item__time">
                                {{ chat.lastMessageAt | date: 'HH:mm' }}
                            </span>
                        }
                    </div>

                    <div class="chat-item__bottom">
                        <span class="chat-item__message">{{ messagePreview(chat) }}</span>

                        @if (chat.unreadCount > 0) {
                            <p-badge
                                [value]="chat.unreadCount"
                                size="small"
                                style="flex: 0 0 auto; margin-left: auto; color: #ffffff;"
                            ></p-badge>
                        }
                    </div>
                </div>
            </div>
        </ng-template>
    </p-listbox>
</div>
