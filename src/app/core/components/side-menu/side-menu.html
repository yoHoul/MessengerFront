<p-drawer
    [visible]="visible()"
    (visibleChange)="visibleChange.emit($event)"
    position="left"
    [modal]="true"
    [dismissible]="true"
    [closable]="false"
    class="side-menu"
    [style]="{ width: '320px' }"
>
    <div class="side-menu__content">
        @if (user(); as currentUser) {
            <div class="profile">
                <p-avatar [label]="initials()" shape="circle" size="large"></p-avatar>
                <div class="profile__info">
                    <span class="profile__name">{{ currentUser.displayName }}</span>
                    <span class="profile__username">&#64;{{ currentUser.username }}</span>
                </div>
            </div>
        }

        <p-button
            label="Настройки аккаунта"
            [text]="true"
            fluid
            (onClick)="openProfile()"
        ></p-button>

        <p-button
            label="Выйти из аккаунта"
            severity="danger"
            [text]="true"
            fluid
            (onClick)="openLogout()"
        ></p-button>

        <div class="divider"></div>

        <p-button
            label="Создать групповой чат"
            [text]="true"
            fluid
            (onClick)="openCreateGroup()"
        ></p-button>

        <div class="theme-row">
            <span>Ночная тема</span>
            <p-toggleswitch
                [ngModel]="theme.isDark()"
                [ngModelOptions]="{ standalone: true }"
                (ngModelChange)="theme.set($event)"
            ></p-toggleswitch>
        </div>
    </div>
</p-drawer>

<app-account-settings-dialog
    [visible]="isProfileOpen()"
    (visibleChange)="isProfileOpen.set($event)"
></app-account-settings-dialog>

<p-dialog
    [visible]="isLogoutOpen()"
    (visibleChange)="isLogoutOpen.set($event)"
    header="Выйти из аккаунта?"
    [draggable]="false"
    [modal]="true"
    [dismissableMask]="true"
>
    <p class="logout-text">Вы уверены, что хотите выйти из аккаунта?</p>

    <div class="dialog-actions">
        <p-button
            label="Отмена"
            [text]="true"
            (onClick)="isLogoutOpen.set(false)"
        ></p-button>
        <p-button
            label="Выйти"
            severity="danger"
            (onClick)="confirmLogout()"
        ></p-button>
    </div>
</p-dialog>

<p-dialog
    [visible]="isCreateGroupOpen()"
    (visibleChange)="isCreateGroupOpen.set($event)"
    header="Создать групповой чат"
    styleClass="group-create-dialog"
    [draggable]="false"
    [modal]="true"
    [dismissableMask]="true"
>
    <div class="group-create">
        <p-avatar [label]="groupAvatarInitials()" shape="circle" size="xlarge"></p-avatar>

        <label class="field">
            <span>Название группы</span>
            <input
                pInputText
                fluid
                type="text"
                [value]="createGroupTitle()"
                (input)="onGroupTitleInput($event)"
            />
        </label>

        @if (isCreateGroupLoading()) {
            <p class="group-create__loading">Загрузка...</p>
        } @else if (isCreateGroupOpen()) {
            <app-user-picker
                [users]="createGroupUsers()"
                (selectionChange)="onGroupSelectionChange($event)"
            ></app-user-picker>
        }

        @if (createGroupError()) {
            <p class="error">{{ createGroupError() }}</p>
        }

        <div class="dialog-actions">
            <p-button
                label="Отмена"
                [text]="true"
                (onClick)="isCreateGroupOpen.set(false)"
            ></p-button>
            <p-button
                label="Создать групповой чат"
                [disabled]="!createGroupTitle().trim()"
                (onClick)="createGroup()"
            ></p-button>
        </div>
    </div>
</p-dialog>
