<p-dialog
    [visible]="visible()"
    (visibleChange)="visibleChange.emit($event)"
    header="Профиль"
    styleClass="user-profile-dialog"
    [draggable]="false"
    [modal]="true"
    [dismissableMask]="true"
>
    <div class="user-profile">
        <p-avatar [label]="initials()" shape="circle" size="xlarge"></p-avatar>

        @if (profile(); as peer) {
            <span class="user-profile__name">{{ name() }}</span>
            <span class="user-profile__tag">&#64;{{ peer.username }}</span>

            @if (!isCurrentUser()) {
                <p-button
                    type="button"
                    class="user-profile__action"
                    [style]="{ width: '3rem', height: '3rem', borderRadius: '50%' }"
                    severity="secondary"
                    [rounded]="true"
                    ariaLabel="Написать"
                    (onClick)="directChat.emit(peer)"
                >
                    <i
                        class="pi pi-comments user-profile__action-icon"
                        aria-hidden="true"
                    ></i>
                </p-button>
            }
        } @else {
            <span class="user-profile__name">{{ name() }}</span>
        }
    </div>
</p-dialog>
