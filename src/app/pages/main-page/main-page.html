<div class="container">
    <div class="chat-menu">
        <div class="menu-header">
            <button
                type="button"
                class="menu-button"
                aria-label="Открыть меню"
                (click)="openMenu()"
            >
                <svg data-p-icon="bars" aria-hidden="true"></svg>
            </button>

            <app-search-chat
                [query]="query()"
                (queryChange)="setQuery($event)"
            ></app-search-chat>
        </div>

        <div class="menu-content">
            @if (isSearching()) {
                <app-chat-search-results
                    [chats]="chats()"
                    [query]="query()"
                    (chatSelected)="onSearchChatSelected($event)"
                    (userSelected)="onSearchUserSelected($event)"
                ></app-chat-search-results>
            } @else {
                <app-chat-menu
                    [chats]="chats()"
                    [selectedChatId]="selectedChatId()"
                    (chatSelected)="selectChat($event)"
                ></app-chat-menu>
            }
        </div>
    </div>

    <div class="chat-window">
        <app-chat-window
            [chat]="selectedChat()"
            (messageSent)="onMessageSent($event)"
            (directChatRequested)="onDirectChatRequested($event)"
        ></app-chat-window>
    </div>

    <app-side-menu
        [visible]="isMenuOpen()"
        (visibleChange)="setMenuOpen($event)"
    ></app-side-menu>
</div>
