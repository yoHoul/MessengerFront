<div class="login">
    <form class="login__form" (submit)="submit($event)">
        <h1 class="login__title">
            {{ isRegistering() ? 'Регистрация' : 'Вход' }}
        </h1>

        <label class="field">
            <span>Логин</span>
            <input
                pInputText
                fluid
                type="text"
                autocomplete="username"
                [value]="login()"
                (input)="onLoginInput($event)"
            />
        </label>

        <label class="field">
            <span>Пароль</span>
            <div class="password-field">
                <input
                    pInputText
                    fluid
                    [type]="showPassword() ? 'text' : 'password'"
                    [autocomplete]="isRegistering() ? 'new-password' : 'current-password'"
                    [value]="password()"
                    (input)="onPasswordInput($event)"
                />
                <button
                    type="button"
                    class="password-field__toggle"
                    [attr.aria-label]="showPassword() ? 'Скрыть пароль' : 'Показать пароль'"
                    (click)="showPassword.set(!showPassword())"
                >
                    <i
                        [class]="showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"
                        aria-hidden="true"
                    ></i>
                </button>
            </div>
        </label>

        @if (isRegistering()) {
            <label class="field">
                <span>Подтвердите пароль</span>
                <div class="password-field">
                    <input
                        pInputText
                        fluid
                        [type]="showConfirmPassword() ? 'text' : 'password'"
                        autocomplete="new-password"
                        [value]="confirmPassword()"
                        (input)="onConfirmPasswordInput($event)"
                    />
                    <button
                        type="button"
                        class="password-field__toggle"
                        [attr.aria-label]="showConfirmPassword() ? 'Скрыть пароль' : 'Показать пароль'"
                        (click)="showConfirmPassword.set(!showConfirmPassword())"
                    >
                        <i
                            [class]="showConfirmPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"
                            aria-hidden="true"
                        ></i>
                    </button>
                </div>
            </label>
        }

        @if (error()) {
            <p class="error">{{ error() }}</p>
        }

        <p-button
            type="submit"
            [label]="isRegistering() ? 'Зарегистрироваться' : 'Войти'"
            fluid
            [disabled]="isSubmitting()"
        ></p-button>

        <p-button
            type="button"
            [label]="isRegistering() ? 'Назад ко входу' : 'Регистрация'"
            severity="secondary"
            fluid
            [disabled]="isSubmitting()"
            (onClick)="switchMode()"
        ></p-button>
    </form>
</div>
